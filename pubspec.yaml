repository: https://github.com/lizy-coding/gcode_core
issue_tracker: https://github.com/lizy-coding/gcode_core/issues
version: 0.2.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  flutter_gpu:
    sdk: flutter
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  assets:
    - shaders/toolpath.shaderbundle
